[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infectious-disease-assistant"
version = "0.1.0"
description = "Educational infectious-disease workflow using synthetic patient data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.24,<0.25",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
