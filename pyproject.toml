[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infectious-disease-assistant"
version = "0.1.0"
description = "Infectious-disease workflow demo using synthetic patient data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143,<0.144",
    "httpx>=0.28,<0.29",
    "openai-agents>=0.24,<0.25",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live_api'"

markers = [
    "integration: requires an explicitly configured PostgreSQL/pgvector test database",
    "live_api: requires explicit live provider credentials; excluded from default tests and CI",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.package-data]
"infectious_disease_assistant.rag" = ["sql/*.sql"]
"infectious_disease_assistant.workflow" = ["sql/*.sql"]
